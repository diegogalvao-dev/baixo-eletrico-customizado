# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = 121317
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/instrumento

# Faz o Hibernate dropar e recriar as tabelas toda vez que a aplicação inicia
# Garante a recriação das tabelas
# quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.generation=update

# Ajuda a liberar conexões para o drop não falhar
# quarkus.datasource.jdbc.acquisition-timeout=10
# quarkus.hibernate-orm.sql-load-script=import.sql

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o type em exception
%dev.problem.base-url=http://localhost:8080
%prod.problem.base-url=https://api.seusistema.com

# configuracao do seaweedfs
seaweedfs.master.url=http://localhost:9333
seaweedfs.filer.url=http://localhost:8888
seaweedfs.request-timeout-ms=10000

# dev service do seaweedfs (sobe container automaticamente no perfil dev)
# para desabilitar: %dev.seaweedfs.devservice.enabled=false
%dev.seaweedfs.devservice.enabled=true

# log detalhado no perfil dev
%dev.quarkus.log.console.enable=true
%dev.quarkus.log.console.level=DEBUG
%dev.quarkus.log.category."br.unitins.tp2".level=DEBUG
%dev.quarkus.log.category."io.vertx.ext.web".level=DEBUG
%dev.quarkus.log.category."io.quarkus.vertx.http".level=DEBUG

# configuracao do jwt 
# Removido em favor do quarkus-oidc (Keycloak)

# configuracao do keycloak / oidc
keycloak.server-url=http://localhost:8180
keycloak.realm=tp2
keycloak.client-id=quarkus-app
keycloak.client-secret=quarkus-secret
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.request-timeout-ms=10000

%dev.quarkus.oidc.auth-server-url=${keycloak.server-url}/realms/${keycloak.realm}
%dev.quarkus.oidc.client-id=${keycloak.client-id}
%dev.quarkus.oidc.credentials.secret=${keycloak.client-secret}
%prod.quarkus.oidc.auth-server-url=${keycloak.server-url}/realms/${keycloak.realm}
%prod.quarkus.oidc.client-id=${keycloak.client-id}
%prod.quarkus.oidc.credentials.secret=${keycloak.client-secret}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=SecurityScheme
quarkus.smallrye-openapi.security-scheme-description=Bearer JWT authentication
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer
quarkus.smallrye-openapi.jwt-bearer-format=JWT

# dev service do keycloak - DESABILITADO (Testcontainers tem bug no Windows)
# Rode o Keycloak manualmente: docker run --name keycloak ...
quarkus.keycloak.devservices.enabled=false
